<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1fa774">
  <title>Envelopes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    // Apply the saved Appearance choice before the page draws, to avoid a flash of the wrong theme.
    try { const t = localStorage.getItem('envelopes-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="sheet-root"></div>
  <div id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
